# 每个 PR 和 main 上的每次推送：检查后端、前端和 shell 脚本，再构建两个镜像。
# 推送到 main 或 v* 标签时，检查全部通过才把镜像推到 GHCR（部署见 docs/deploy.md「升级」）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# 同一个 PR 推了新提交时取消旧的运行；main 上的每次推送都跑完，免得漏发镜像
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# 自托管 runner 跑在这台服务器上，出网统一走本机的 mihomo（mixed-port 7890）。
# GitHub 托管的 runner 不需要这段，但这里已经不用托管 runner 了。
env:
  HTTP_PROXY: http://127.0.0.1:7890
  HTTPS_PROXY: http://127.0.0.1:7890
  http_proxy: http://127.0.0.1:7890
  https_proxy: http://127.0.0.1:7890
  NO_PROXY: localhost,127.0.0.1,::1
  no_proxy: localhost,127.0.0.1,::1

jobs:
  backend:
    runs-on: [self-hosted, linux, x64]
    # 平时 2 分钟左右；测试挂住时不等到 GitHub 默认的 6 小时
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # 这个 action 不发布 v10 这样的大版本标签
        with:
          working-directory: backend
          enable-cache: true
      # --locked：uv.lock 和 pyproject.toml 对不上时失败
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pyright
      # 单个测试 2 分钟还没结束时打印所有线程的栈，挂住时能看出卡在哪里
      - run: uv run pytest -o faulthandler_timeout=120

  frontend:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # shadcn 纪律里能机器检查的几条：cn 的导入、任意值里的颜色、important 类、不再引用 Astryx（frontend/AGENTS.md）
      - run: sh scripts/check-discipline.sh
      # next build 由下面的镜像构建跑

  shellcheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/*.sh scripts/*.sh frontend/scripts/*.sh
      # wayfinder 地图的票：已解决的有结论、Blocked by 的票号存在、地图链接到它（docs/agents/issue-tracker.md）
      - run: sh scripts/check-scratch.sh

  image:
    needs: [backend, frontend, shellcheck]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :main，v1.2.3 → :1.2.3 和 :latest，每次推送另有 :sha-<7 位提交哈希> 方便回滚
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/soulrewrite/eidolon-sc-${{ matrix.service }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha
      # PR 上只构建、不推送
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          # 构建容器共享宿主机网络，Dockerfile 里的 npm/uv 才能通过 127.0.0.1:7890 出网
          network: host
          build-args: |
            HTTP_PROXY=http://127.0.0.1:7890
            HTTPS_PROXY=http://127.0.0.1:7890
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
